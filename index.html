
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeraLog</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-title" content="PeraLog" />
    <link rel="apple-touch-icon" href="./img/icon-192.png" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <div class="header-left">
          <div class="header-brand">
            <img src="img/icon-192.png" width="32" height="32" alt="PeraLog Logo" />
            <h1>PeraLog</h1>
          </div>
          <p class="subtitle">Track where your money goes</p>
        </div>
        <button
          type="button"
          id="theme-toggle"
          class="btn-theme"
          aria-label="Switch to dark mode"
          aria-pressed="false"
          title="Switch to dark mode"
        >&#x1F319;</button>
      </header>

      <!-- Summary Cards -->
      <section class="summary-grid" aria-label="Spending summary">
        <div class="summary-card" id="summary-week">
          <span class="summary-label">&#x1F4C5; This Week</span>
          <span class="summary-amount" id="total-week">&#x20B1;0.00</span>
        </div>
        <div class="summary-card" id="summary-month">
          <span class="summary-label">&#x1F4C6; This Month</span>
          <span class="summary-amount" id="total-month">&#x20B1;0.00</span>
        </div>
      </section>

      <!-- Monthly Budget -->
      <section class="card budget-card" aria-label="Monthly budget">
        <h2 class="section-title">Monthly Budget</h2>

        <div id="budget-empty-state" class="budget-state">
          <button type="button" id="budget-set" class="btn-budget btn-budget-primary">Set a monthly budget</button>
        </div>

        <div id="budget-form-state" class="budget-state hidden">
          <label for="budget-input">Monthly budget (&#x20B1;)</label>
          <div class="budget-input-row">
            <input type="number" id="budget-input" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" />
            <button type="button" id="budget-save" class="btn-budget btn-budget-primary">Save</button>
          </div>
          <span id="budget-error" class="field-error"></span>
        </div>

        <div id="budget-active-state" class="budget-state hidden">
          <div class="budget-status-row">
            <p id="budget-status" class="budget-status"></p>
            <button type="button" id="budget-edit" class="btn-budget btn-budget-secondary">Edit</button>
          </div>
          <div class="progress-bar" role="progressbar" aria-label="Monthly budget used" aria-valuemin="0" aria-valuemax="100">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>
      </section>

      <!-- Add Expense Form -->
      <section class="card form-card">
        <h2 class="section-title">Add Expense</h2>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              placeholder="e.g. Coffee, Bus ticket..."
              maxlength="60"
              required
            />
            <span class="field-error" id="error-name"></span>
          </div>

          <div class="form-group">
            <label for="amount">Price each (&#x20B1;)</label>
            <input
              type="number"
              id="amount"
              placeholder="0.00"
              min="0.01"
              step="0.01"
              required
            />
            <span class="field-error" id="error-amount"></span>
          </div>

          <div class="form-group">
            <label for="quantity">Quantity</label>
            <input
              type="number"
              id="quantity"
              min="1"
              step="1"
              value="1"
              required
            />
            <span class="field-error" id="error-quantity"></span>
          </div>

          <div class="form-group">
            <label for="expense-date">Date</label>
            <input
              type="date"
              id="expense-date"
              required
            />
            <span class="field-error" id="error-date"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="" disabled selected>Select a category</option>
              <option value="Food">&#x1F354; Food</option>
              <option value="Transport">&#x1F68C; Transport</option>
              <option value="Load &amp; Data">&#x1F4F1; Load &amp; Data</option>
              <option value="School">&#x1F393; School</option>
              <option value="Bills">&#x1F9FE; Bills</option>
              <option value="Shopping">&#x1F6CD;&#xFE0F; Shopping</option>
              <option value="Health">&#x1F3E5; Health</option>
              <option value="Fun">&#x1F389; Fun</option>
              <option value="Other">&#x1F4E6; Other</option>
            </select>
            <span class="field-error" id="error-category"></span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Add Expense</button>
            <button type="button" id="btn-cancel" class="btn-cancel hidden">Cancel</button>
          </div>
        </form>
      </section>

      <!-- Expense List -->
      <section class="card list-card">
        <div class="list-header">
          <h2 class="section-title">Spending List</h2>
          <!-- Controls area -->
          <div class="list-controls">
            <div class="filter-bar">
              <label for="filter-category" class="filter-label">Filter</label>
              <select id="filter-category" class="filter-select">
                <option value="">All Categories</option>
                <option value="Food">&#x1F354; Food</option>
                <option value="Transport">&#x1F68C; Transport</option>
                <option value="Load &amp; Data">&#x1F4F1; Load &amp; Data</option>
                <option value="School">&#x1F393; School</option>
                <option value="Bills">&#x1F9FE; Bills</option>
                <option value="Shopping">&#x1F6CD;&#xFE0F; Shopping</option>
                <option value="Health">&#x1F3E5; Health</option>
                <option value="Fun">&#x1F389; Fun</option>
                <option value="Other">&#x1F4E6; Other</option>
              </select>
            </div>
            <button
              type="button"
              id="btn-select"
              class="btn-secondary btn-icon"
              title="Select expenses"
              aria-label="Select expenses"
            >&#x2611;&#xFE0F;</button>
            <button
              type="button"
              id="btn-export"
              class="btn-secondary btn-icon"
              title="Export CSV"
              aria-label="Export CSV"
            >&#x1F4E5;</button>
          </div>
        </div>
        <ul id="expense-list" class="expense-list"></ul>
        <p id="empty-state" class="empty-state">No expenses yet. Add one above!</p>
      </section>
    </div>

    <div id="bulk-action-bar" class="bulk-action-bar hidden" role="toolbar" aria-label="Bulk actions">
      <button type="button" id="btn-select-all" class="btn-bulk btn-bulk-secondary">Select All</button>
      <button type="button" id="btn-cancel-select" class="btn-bulk btn-bulk-secondary">Cancel</button>
      <button type="button" id="btn-delete-selected" class="btn-bulk btn-bulk-danger" disabled>Delete (0)</button>
    </div>

    <div id="toast" class="hidden" role="status" aria-live="polite">
      <span>Expense deleted.</span>
      <button type="button" id="btn-undo">Undo</button>
    </div>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered.'))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
